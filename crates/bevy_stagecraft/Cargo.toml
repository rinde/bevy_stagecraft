[package]
name = "bevy_stagecraft"
version = "0.1.0"
description = "Scripted pointer and keyboard scenarios for testing Bevy UI headlessly"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
record = [
    "bevy/bevy_core_pipeline",
    "bevy/bevy_ui_render",
    "bevy/bevy_sprite_render",
    "bevy/bevy_render",
    "dep:image",
]
gallery = [
    "bevy/bevy_winit",
    "bevy/x11",
    "bevy/wayland",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_ui_render",
    "bevy/bevy_sprite_render",
    "dep:objc2",
    "dep:objc2-app-kit",
]

[dependencies]
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
image = { version = "0.25.9", default-features = false, features = ["png", "gif"], optional = true }
# Turns off automatic window tabbing, which would put the Scenarios window in a
# tab over the app window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"], optional = true }

# Deliberately no audio, gamepad or dynamic_linking: a library must not force
# them on whoever depends on it.
[dependencies.bevy]
workspace = true
features = [
    "bevy_window",
    "mouse",
    "keyboard",
    "bevy_input_focus",
    "bevy_picking",
    "ui_picking",
    "bevy_ui",
    "bevy_ui_widgets",
    "bevy_text",
    "default_font",
    "bevy_asset",
    # The player waits for the scene a setup spawned to load.
    "bevy_scene",
    "bevy_camera",
    "bevy_render",
    "bevy_image",
    "bevy_mesh",
    "bevy_gizmos",
    "bevy_state",
    # Finds the app's `#[reflect(AppCheck)]` type with no registration call.
    "reflect_auto_register",
    "serialize",
    "bevy_world_serialization",
    "bevy_log",
]

# `debug` enables `ScheduleBuildSettings::shuffle_seed` for the shuffled-schedule
# tests. Dev-only, so dependents do not get it.
[dev-dependencies.bevy]
workspace = true
features = ["debug"]

[[test]]
name = "ron_scenarios"
harness = false

[lints]
workspace = true

# Needs a (software) GPU: ignored by `just test`, run by `just test-gpu`.
[[test]]
name = "recorder"
required-features = ["record"]

[[test]]
name = "screenshots"
required-features = ["record"]

[[test]]
name = "gallery"
required-features = ["gallery"]

# A small plain-UI app in the gallery. Needs a display.
[[example]]
name = "gallery"
required-features = ["gallery"]
