[package]
name = "bevy_stagecraft"
version = "0.1.0"
description = "Scripted pointer and keyboard scenarios for testing Bevy UI headlessly"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Offscreen rendering, used to record scenarios for review.
record = [
    "bevy/bevy_core_pipeline",
    "bevy/bevy_ui_render",
    "bevy/bevy_sprite_render",
    "bevy/bevy_render",
    "dep:image",
]
# Real windows, used to play scenarios back in the gallery: the windowing
# backends and the renderer that draws UI into them.
gallery = [
    "bevy/bevy_winit",
    "bevy/x11",
    "bevy/wayland",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_ui_render",
    "bevy/bevy_sprite_render",
    "dep:objc2",
    "dep:objc2-app-kit",
]

[dependencies]
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
# PNG and GIF encoding for the recorder; nothing else of the crate.
image = { version = "0.25.10", default-features = false, features = ["png", "gif"], optional = true }
# macOS only: the gallery turns off automatic window tabbing, which would
# otherwise put the Scenarios window in a tab over the app window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow"], optional = true }

# Deliberately no audio, gamepad or dynamic_linking: a library must not force
# those on whoever depends on it.
[dependencies.bevy]
workspace = true
features = [
    # Minimum to run headless: windows, mouse and keyboard input, and focus
    # (bevy_input itself is always on).
    "bevy_window",
    "mouse",
    "keyboard",
    "bevy_input_focus",
    # Picking, so scripted pointers hit UI nodes.
    "bevy_picking",
    "ui_picking",
    # UI itself and its widgets.
    "bevy_ui",
    "bevy_ui_widgets",
    # Text, with the bundled font so tests need no assets.
    "bevy_text",
    "default_font",
    # Assets, cameras, and the types UI layout and rendering refer to.
    "bevy_asset",
    # BSN scenes, so the player can wait for the scene a setup spawned to be
    # loaded (`player` module) and tests can spawn one.
    "bevy_scene",
    "bevy_camera",
    "bevy_render",
    "bevy_image",
    "bevy_mesh",
    "bevy_gizmos",
    # App states, so a check can ask which state the app is in.
    "bevy_state",
    # Types that derive Reflect register themselves, so the app's check type
    # (`#[reflect(AppCheck)]`) is found with no registration call. Part of
    # Bevy's default app features anyway.
    "reflect_auto_register",
    # Serde for vectors, keys and mouse buttons, so scripts can be written out.
    "serialize",
    # `DynamicWorld` (Bevy's dynamic scene), the format a checkpoint is saved
    # in as a setup for other scenarios (`save` module).
    "bevy_world_serialization",
    # Warnings from the synthetic input systems.
    "bevy_log",
]

# `debug` is Bevy's switch for `ScheduleBuildSettings::shuffle_seed`, which the
# shuffled-schedule tests use. Dev-only, so nobody who depends on the crate
# gets it.
[dev-dependencies.bevy]
workspace = true
features = ["debug"]

# Plays every .ron file in tests/ron, one test per file.
[[test]]
name = "ron_scenarios"
harness = false

[lints]
workspace = true

# Needs a (software) GPU: ignored by `just test`, run by `just test-gpu`.
[[test]]
name = "recorder"
required-features = ["record"]

[[test]]
name = "screenshots"
required-features = ["record"]

# Plays against two headless windows; no GPU needed.
[[test]]
name = "gallery"
required-features = ["gallery"]

# A small plain-UI app in the gallery. Needs a display.
[[example]]
name = "gallery"
required-features = ["gallery"]
